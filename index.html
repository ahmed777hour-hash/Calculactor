<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h1>Calculator</h1>
        
        <input type="text" >
        
        <div class="buttons-grid">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>*</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>/</button>
            <button>-</button>
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>.</button>
            
            <button>Del</button>
            <button class="ac">Ac</button>
            <button>=</button>
            <button>Ans</button>
        </div>
    </div>

</body>
</html>
